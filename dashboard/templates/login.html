<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &mdash; VulnIntel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    <style>
        /* This page has no theme toggle -- it follows the system preference
           only, same as the rest of the app does before a user has picked
           an explicit theme. */
        body.login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 32px 28px;
        }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 6px;
        }
        .login-brand i { color: var(--accent); font-size: 1.5rem; }
        .login-subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 24px; }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-brand"><i class="bi bi-shield-shaded"></i> VulnIntel</div>
        <div class="login-subtitle">Sign in to continue to your vulnerability intelligence dashboard.</div>

        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
            {% endif %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-accent w-100">Sign in</button>
        </form>

        <p class="text-muted small mt-4 mb-0">
            No account yet? Ask whoever runs this instance to create one with
            <code>python main.py create-user</code>.
        </p>
    </div>
</body>
</html>
